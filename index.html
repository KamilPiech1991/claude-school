document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

font-size:14px;color:#8A8279\">{{ r.wd }}, {{ r.time }}<\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:15px;color:#C9C1B7\">{{ r.fmt }}<\u002Fdiv>\n          <div style=\"font-family:'Geist Mono';font-size:14px\">{{ r.hours }}<\u002Fdiv>\n          <div style=\"font-size:14px;color:{{ r.seatsColor }}\">{{ r.seatsLabel }}<\u002Fdiv>\n          <div style=\"width:44px;height:44px;border-radius:50%;border:1px solid #4A433C;display:flex;align-items:center;justify-content:center;font-size:18px\">→<\u002Fdiv>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section id=\"lekcja\" style=\"max-width:1280px;margin:0 auto;padding:72px 32px\">\n    <div data-a=\"reveal\" style=\"background:#E8794A;color:#141210;border-radius:32px;padding:clamp(32px,5vw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:48px;align-items:center;overflow:hidden\">\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <div style=\"font-family:'Geist Mono';font-size:13px;text-transform:uppercase;letter-spacing:.08em\">Za 0 zł<\u002Fdiv>\n        <h2 style=\"margin:0;font-family:'Bricolage Grotesque';font-weight:800;font-size:clamp(40px,5vw,72px);line-height:.95;letter-spacing:-.04em;text-wrap:balance\">Pierwsza lekcja Claude. Dziś wieczorem.<\u002Fh2>\n        <p style=\"margin:0;font-size:18px;line-height:1.5;max-width:520px\">45 minut wideo i jedno ćwiczenie na Twoim mailu, dokumencie albo raporcie. Sprawdzisz, czy nasz sposób pracy jest dla Ciebie, zanim zapłacisz za kurs.<\u002Fp>\n        <sc-if value=\"{{ leadOpen }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:10px;padding-top:8px\">\n            <label for=\"lead-email\" style=\"font-size:14px;font-weight:600\">Adres e-mail<\u002Flabel>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <input id=\"lead-email\" type=\"email\" sc-camel-on-change=\"{{ onEmail }}\" placeholder=\"imie@firma.pl\" style=\"flex:1;min-width:220px;background:#F4F1EC;border:0;border-radius:999px;padding:0 24px;height:56px;font-size:17px;color:#141210;outline:none\">\n              <button sc-camel-on-click=\"{{ submitLead }}\" style=\"background:#141210;color:#F4F1EC;border:0;border-radius:999px;padding:0 28px;height:56px;font-size:17px;font-weight:600;cursor:pointer;white-space:nowrap\">Wyślij lekcję<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-size:13px\">Zero spamu. Wypiszesz się jednym kliknięciem.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ leadDone }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#141210;color:#F4F1EC;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:6px\">\n            <div style=\"font-family:'Bricolage Grotesque';font-weight:700;font-size:26px\">Lekcja jest w drodze.<\u002Fdiv>\n            <div style=\"color:#C9C1B7;font-size:15px\">Sprawdź skrzynkę {{ email }}.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"position:relative;min-height:380px\">\n        <div data-a=\"float\" style=\"position:absolute;right:8%;top:0;width:72%;transform:rotate(4deg);background:#141210;border-radius:20px;padding:14px;box-shadow:0 30px 60px rgba(60,20,0,.35)\">\n          <div style=\"aspect-ratio:16/10;border-radius:12px;background:repeating-linear-gradient(135deg,#1E1B18 0 10px,#231F1B 10px 20px);display:flex;align-items:center;justify-content:center;position:relative\">\n            <div style=\"width:64px;height:64px;border-radius:50%;background:#E8794A;display:flex;align-items:center;justify-content:center;font-size:22px;color:#141210;padding-left:4px\">▶<\u002Fdiv>\n            <div style=\"position:absolute;left:12px;top:12px;font-family:'Geist Mono';font-size:11px;color:#8A8279\">kadr z lekcji wideo<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;padding:14px 4px 4px;color:#F4F1EC;font-size:14px\"><span style=\"font-family:'Geist Mono';color:#E8794A\">00:00<\u002Fspan><div style=\"flex:1;height:3px;border-radius:2px;background:#3A342E;position:relative\"><div style=\"position:absolute;left:0;top:0;bottom:0;width:32%;background:#E8794A;border-radius:2px\"><\u002Fdiv><\u002Fdiv><span style=\"font-family:'Geist Mono';color:#8A8279\">45:00<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-a=\"float\" style=\"position:absolute;left:0;bottom:0;width:62%;transform:rotate(-3deg);background:#F4F1EC;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 24px 48px rgba(60,20,0,.3)\">\n          <div style=\"font-family:'Geist Mono';font-size:12px;color:#6B635A;text-transform:uppercase;letter-spacing:.08em\">Ćwiczenie po lekcji<\u002Fdiv>\n          <div style=\"font-size:17px;font-weight:600;line-height:1.35\">Przepisz jeden swój mail tak, żeby Claude napisał go w Twoim stylu.<\u002Fdiv>\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap\"><span style=\"background:#141210;color:#F4F1EC;border-radius:999px;padding:4px 10px;font-size:12px\">10 min<\u002Fspan><span style=\"border:1px solid #C9C1B7;border-radius:999px;padding:4px 10px;font-size:12px\">Twój mail<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"trenerzy\" style=\"max-width:1280px;margin:0 auto;padding:72px 32px\">\n    <h2 data-a=\"reveal\" style=\"margin:0 0 40px;font-family:'Bricolage Grotesque';font-weight:700;font-size:clamp(36px,4.6vw,64px);line-height:1;letter-spacing:-.035em;max-width:760px;text-wrap:balance\">Uczą ludzie, którzy pracują z Claude codziennie.<\u002Fh2>\n    <div data-a=\"stagger\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:20px\">\n      <sc-for list=\"{{ trainers }}\" as=\"t\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <div style=\"aspect-ratio:4/5;border-radius:24px;overflow:hidden;position:relative;border:1px solid #2E2A25\">\n            <div style=\"position:absolute;inset:0;background:repeating-linear-gradient(135deg,#1E1B18 0 10px,#231F1B 10px 20px);transition:transform .6s cubic-bezier(.2,.7,.2,1)\" style-hover=\"transform:scale(1.04)\"><\u002Fdiv>\n            <div style=\"position:absolute;left:16px;top:16px;font-family:'Geist Mono';font-size:12px;color:#8A8279\">portret trenera<\u002Fdiv>\n            <div style=\"position:absolute;left:16px;bottom:16px;background:#F4F1EC;color:#141210;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600\">{{ t.role }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <div style=\"font-family:'Bricolage Grotesque';font-weight:700;font-size:24px\">{{ t.name }}<\u002Fdiv>\n            <div style=\"font-size:15px;color:#A39A90;line-height:1.5\">{{ t.bio }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1280px;margin:0 auto;padding:72px 32px\">\n    <div data-a=\"stagger\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px\">\n      <sc-for list=\"{{ quotes }}\" as=\"q\" hint-placeholder-count=\"3\">\n        <div style=\"border:1px solid #2A2622;border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:28px;justify-content:space-between;background:#171512\">\n          <div style=\"font-family:'Bricolage Grotesque';font-size:64px;line-height:.5;color:#E8794A;height:28px\">“<\u002Fdiv>\n          <div style=\"font-family:'Bricolage Grotesque';font-weight:500;font-size:23px;line-height:1.28;letter-spacing:-.01em;text-wrap:pretty;flex:1\">{{ q.text }}<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;border-top:1px solid #2A2622;padding-top:20px\">\n            <div style=\"width:44px;height:44px;border-radius:50%;background:repeating-linear-gradient(135deg,#1E1B18 0 6px,#2A2622 6px 12px)\"><\u002Fdiv>\n            <div><div style=\"font-size:15px;font-weight:600\">{{ q.who }}<\u002Fdiv><div style=\"font-size:14px;color:#8A8279\">{{ q.role }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"firmy\" style=\"max-width:1280px;margin:0 auto;padding:72px 32px\">\n    <div data-a=\"reveal\" style=\"border:1px solid #2A2622;border-radius:32px;padding:clamp(32px,5vw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;background:#1C1916\">\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <div style=\"font-family:'Geist Mono';font-size:13px;color:#E8794A;text-transform:uppercase;letter-spacing:.08em\">Dla firm<\u002Fdiv>\n        <h2 style=\"margin:0;font-family:'Bricolage Grotesque';font-weight:700;font-size:clamp(36px,4.4vw,60px);line-height:1;letter-spacing:-.035em;text-wrap:balance\">Szkolenie zamknięte dla Twojego zespołu.<\u002Fh2>\n        <p style=\"margin:0;font-size:18px;line-height:1.5;color:#C9C1B7\">Program układamy pod Wasze procesy i dane. U Was w biurze, w naszej sali albo online.<\u002Fp>\n        <button sc-camel-on-click=\"{{ toB2bForm }}\" style=\"align-self:flex-start;background:#E8794A;color:#141210;border:0;border-radius:999px;padding:0 28px;height:56px;font-size:16px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s\" style-hover=\"background:#F4F1EC\">Umów bezpłatną rozmowę<\u002Fbutton>\n      <\u002Fdiv>\n      <div data-a=\"stagger\" style=\"display:flex;flex-direction:column\">\n        <div style=\"display:flex;gap:20px;padding:20px 0;border-bottom:1px solid #2A2622\"><div style=\"font-family:'Geist Mono';color:#E8794A\">01<\u002Fdiv><div style=\"font-size:17px;line-height:1.45\">Analiza przed szkoleniem: które zadania w zespole oddać Claude<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:20px;padding:20px 0;border-bottom:1px solid #2A2622\"><div style=\"font-family:'Geist Mono';color:#E8794A\">02<\u002Fdiv><div style=\"font-size:17px;line-height:1.45\">Ćwiczenia na Waszych dokumentach, z zasadami bezpieczeństwa danych<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:20px;padding:20px 0;border-bottom:1px solid #2A2622\"><div style=\"font-family:'Geist Mono';color:#E8794A\">03<\u002Fdiv><div style=\"font-size:17px;line-height:1.45\">Konfiguracja Projektów i instrukcji dla całego zespołu<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:20px;padding:20px 0\"><div style=\"font-family:'Geist Mono';color:#E8794A\">04<\u002Fdiv><div style=\"font-size:17px;line-height:1.45\">Raport po szkoleniu i 30 dni wsparcia trenera<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:960px;margin:0 auto;padding:72px 32px 96px\">\n    <h2 data-a=\"reveal\" style=\"margin:0 0 32px;font-family:'Bricolage Grotesque';font-weight:700;font-size:clamp(32px,4vw,52px);letter-spacing:-.03em\">Pytania<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;border-top:1px solid #2A2622\">\n      <sc-for list=\"{{ faq }}\" as=\"f\" hint-placeholder-count=\"4\">\n        <div style=\"border-bottom:1px solid #2A2622\">\n          <button sc-camel-on-click=\"{{ f.toggle }}\" aria-expanded=\"{{ f.open }}\" style=\"width:100%;display:flex;justify-content:space-between;gap:24px;padding:24px 0;background:none;border:0;color:#F4F1EC;text-align:left;cursor:pointer;white-space:normal;font-size:19px;font-weight:500\"><span>{{ f.q }}<\u002Fspan><span style=\"color:#E8794A;font-size:24px;line-height:1\">{{ f.sign }}<\u002Fspan><\u002Fbutton>\n          <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:0 0 24px;color:#C9C1B7;font-size:16px;line-height:1.6 delegowanie zadania od rozmowy.'], ['Jak zlecić zadanie', 'Cel, materiały, granice, kryteria odbioru.'], ['Pliki i foldery', 'Porządkowanie, zestawienia, raporty z wielu dokumentów.'], ['Kontrola wyniku', 'Jak sprawdzać i akceptować pracę agenta.'], ['Konektory', 'Poczta, kalendarz, dysk. Claude z dostępem do narzędzi.'], ['Zadania cykliczne', 'Raport w każdy poniedziałek bez Twojego udziału.'], ['Uprawnienia i bezpieczeństwo', 'Do czego dać dostęp, a do czego nigdy.'], ['Warsztat: tydzień dla agenta', 'Wybierasz trzy zadania i oddajesz je na stałe.']],\n      for: ['Toniesz w powtarzalnych zadaniach na plikach i mailach', 'Chcesz delegować całe zadania, nie pojedyncze pytania', 'Odpowiadasz za wdrożenie AI w zespole'],\n      out: ['Trzy zadania oddane agentowi na stałe', 'Zasady bezpieczeństwa gotowe dla zespołu', 'Certyfikat ukończenia Claude School'] }\n  ];\n  sess = [\n    ['s1', 'zero', 8, '10', 'paź', 'sobota', '9:00–17:00', 'Warszawa · sala', 3],\n    ['s2', 'code', 8, '17', 'paź', 'sobota', '9:00–17:00', 'Warszawa · sala', 4],\n    ['s3', 'cowork', 4, '21', 'paź', 'wtorek', '17:00–21:00', 'Online na żywo', 9],\n    ['s4', 'zero', 4, '23', 'paź', 'czwartek', '17:00–21:00', 'Online na żywo', 7],\n    ['s5', 'code', 4, '28', 'paź', 'wtorek', '17:00–21:00', 'Online na żywo', 6],\n    ['s6', 'cowork', 8, '7', 'lis', 'sobota', '9:00–17:00', 'Warszawa · sala', 8],\n    ['s7', 'zero', 8, '14', 'lis', 'sobota', '9:00–17:00', 'Warszawa · sala', 10],\n    ['s8', 'code', 8, '21', 'lis', 'sobota', '9:00–17:00', 'Warszawa · sala', 11],\n    ['s9', 'zero', 4, '2', 'gru', 'wtorek', '17:00–21:00', 'Online na żywo', 12],\n    ['s10', 'cowork', 4, '4', 'gru', 'czwartek', '17:00–21:00', 'Online na żywo', 12]\n  ].map(a => ({ id: a[0], c: a[1], h: a[2], day: a[3], mon: a[4], wd: a[5], time: a[6], fmt: a[7], seats: a[8] }));\n  trainers = [\n    { name: 'Imię Nazwisko', role: 'Claude od zera · Cowork', bio: 'Wdraża Claude w działach sprzedaży i HR. Prowadzi szkolenia od 2023 roku.' },\n    { name: 'Imię Nazwisko', role: 'Claude Code', bio: 'Product engineer. Buduje wewnętrzne narzędzia z Claude Code dla zespołów nietechnicznych.' },\n    { name: 'Imię Nazwisko', role: 'Szkolenia dla firm', bio: 'Projektuje programy zamknięte pod procesy klienta. Wcześniej konsultant ds. automatyzacji.' }\n  ];\n  quotes = [\n    { text: 'Pierwszy raport kwartalny po kursie zrobiłam w godzinę. Wcześniej zajmował mi dwa dni.', who: 'Imię N.', role: 'Analityczka, branża FMCG' },\n    { text: 'Nie umiem programować, a mam działające narzędzie do wycen. Zespół używa go codziennie.', who: 'Imię N.', role: 'Właściciel firmy remontowej' },\n    { text: 'Szkolenie zamknięte ułożone pod nasze procesy. Po miesiącu Claude robi za nas trzy raporty.', who: 'Imię N.', role: 'Dyrektorka operacyjna' }\n  ];\n  faqs = [\n    ['Czy muszę znać AI albo programowanie?', 'Nie. Każdy kurs zaczyna od podstaw. Do Claude Code wystarczy, że umiesz obsługiwać komputer.'],\n    ['Czy potrzebuję płatnego konta Claude?', 'Na czas kursu dajemy dostęp. Po kursie doradzimy, który plan ma sens w Twojej pracy.'],\n    ['Czym różni się wersja 4 h od 8 h?', 'Wersja 4 h to cztery moduły podstaw. Wersja 8 h dodaje cztery moduły zaawansowane i warsztat na Twoim własnym procesie.'],\n    ['Czy wystawiacie fakturę?', 'Tak, fakturę VAT na firmę lub osobę prywatną. Możliwe finansowanie z KFS.']\n  ];\n  state = { page: this.props.startPage ?? 'home', courseId: 'zero', durs: { zero: 8, code: 8, cowork: 4 }, filter: 'all', leadDone: false, email: '', faq: 0, sessionId: null, signupDone: false };\n\n  componentDidMount() { try { history.scrollRestoration = 'manual'; } catch (e) {} this.waitGsap(() => this.animate()); }\n  componentDidUpdate(pp, ps) {\n    if (ps.page !== this.state.page || ps.courseId !== this.state.courseId) { if (window.ScrollTrigger) window.ScrollTrigger.clearScrollMemory && window.ScrollTrigger.clearScrollMemory('manual'); window.scrollTo(0, 0); this.waitGsap(() => { this.animate(); window.scrollTo(0, 0); }); }\n    else if (ps.filter !== this.state.filter && window.ScrollTrigger) setTimeout(() => window.ScrollTrigger.refresh(), 50);\n  }\n  componentWillUnmount() { this.ctx && this.ctx.revert(); }\n  waitGsap(cb) { let n = 0; const t = () => { if (window.gsap && window.ScrollTrigger) setTimeout(cb, 30); else if (n++ < 120) setTimeout(t, 50); }; t(); }\n  animate() {\n    const g = window.gsap; g.registerPlugin(window.ScrollTrigger);\n    this.ctx && this.ctx.revert();\n    if ((this.props.motion ?? true) === false || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    const q = s => g.utils.toArray(s);\n    this.ctx = g.context(() => {\n      const tl = g.timeline({ defaults: { ease: 'power4.out' } });\n      if (q('[data-a=\"word\"]').length) tl.from('[data-a=\"word\"]', { yPercent: 110, duration: 1, stagger: 0.05 });\n      if (q('[data-a=\"fade\"]').length) tl.from('[data-a=\"fade\"]', { y: 24, autoAlpha: 0, duration: 0.8, stagger: 0.08 }, '-=0.7');\n      if (q('[data-a=\"card\"]').length) tl.from('[data-a=\"card\"]', { y: 80, autoAlpha: 0, rotate: i => [-3, 4, -2][i % 3], duration: 1.1, stagger: 0.14, ease: 'expo.out' }, '-=0.9');\n      q('[data-a=\"float\"]').forEach((el, i) => g.to(el, { y: i % 2 ? 10 : -10, duration: 2.6 + i * 0.4, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: 1.4 }));\n      q('[data-a=\"pulse\"]').forEach(el => g.to(el, { scale: 1.8, autoAlpha: 0.3, duration: 0.9, yoyo: true, repeat: -1, ease: 'sine.inOut' }));\n      q('[data-a=\"caret\"]').forEach(el => g.to(el, { autoAlpha: 0, duration: 0.5, repeat: -1, yoyo: true, ease: 'steps(1)' }));\n      q('[data-a=\"typed\"]').forEach(el => {\n        const full = el.dataset.text, o = { n: 0 }; el.textContent = '';\n        const t2 = g.timeline({ delay: 1.6, repeat: -1, repeatDelay: 3 });\n        t2.to(o, { n: full.length, duration: 2.4, ease: 'none', onUpdate: () => { el.textContent = full.slice(0, Math.round(o.n)); } })\n          .fromTo('[data-a=\"reply\"]', { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.5, stagger: 0.35 }, '+=0.4')\n          .to('[data-a=\"reply\"]', { autoAlpha: 0, duration: 0.4 }, '+=3.5')\n          .set(o, { n: 0, onComplete: () => { el.textContent = ''; } });\n      });\n      q('[data-a=\"marquee\"]').forEach(el => g.to(el, { xPercent: -50, duration: 32, ease: 'none', repeat: -1 }));\n      q('[data-a=\"parallax\"]').forEach(el => g.fromTo(el, { y: -30 }, { y: 30, ease: 'none', scrollTrigger: { trigger: el.parentNode, start: 'top bottom', end: 'bottom top', scrub: true } }));\n      q('[data-a=\"reveal\"]').forEach(el => g.from(el, { y: 56, autoAlpha: 0, duration: 1, ease: 'power3.out', scrollTrigger: { trigger: el, start: 'top 88%', once: true } }));\n      q('[data-a=\"stagger\"]').forEach(el => g.from(el.children, { y: 36, autoAlpha: 0, duration: 0.8, stagger: 0.08, ease: 'power3.out', scrollTrigger: { trigger: el, start: 'top 88%', once: true } }));\n      q('[data-a=\"line\"]').forEach(el => g.from(el, { scaleX: 0, transformOrigin: 'left center', duration: 1.2, ease: 'expo.out', scrollTrigger: { trigger: el, start: 'top 90%', once: true } }));\n      q('[data-a=\"spin\"]').forEach(el => g.to(el, { rotation: 360, transformOrigin: '50% 50%', duration: 16, ease: 'none', repeat: -1 }));\n      q('[data-a=\"sheet\"]').forEach(el => {\n        const t3 = g.timeline({ scrollTrigger: { trigger: el, start: 'top 72%', once: true } });\n        t3.from(el, { rotate: -4, y: 60, autoAlpha: 0, duration: 0.9, ease: 'expo.out' })\n          .from(el.querySelectorAll('[data-a=\"strike\"]'), { scaleX: 0, transformOrigin: 'left center', duration: 0.45, ease: 'power2.inOut' })\n          .from(el.querySelectorAll('[data-a=\"ink\"]'), { autoAlpha: 0, x: -8, duration: 0.45, stagger: 0.3 })\n          .from(el.querySelectorAll('[data-a=\"grade\"]'), { scale: 2.6, autoAlpha: 0, rotate: -40, duration: 0.55, ease: 'back.out(2.2)' });\n      });\n      q('[data-a=\"bell\"]').forEach(el => g.fromTo(el, { left: '0%' }, { left: '100%', ease: 'none', scrollTrigger: { trigger: el.parentNode, start: 'top 80%', end: 'bottom 30%', scrub: 0.6 } }));\n      q('[data-a=\"drift\"]').forEach(el => g.fromTo(el, { xPercent: 4 }, { xPercent: -8, ease: 'none', scrollTrigger: { trigger: el, start: 'top bottom', end: 'bottom top', scrub: 1 } }));\n    });\n  }\n  afterNav() { setTimeout(() => { window.scrollTo(0, 0); this.waitGsap(() => { this.animate(); window.scrollTo(0, 0); }); }, 0); }\n  goPage(patch, cb) { this.setState(patch, () => { this.afterNav(); cb && setTimeout(cb, 200); }); }\n  scrollTo(id) {\n    const go = () => { const el = document.getElementById(id); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 72, behavior: 'smooth' }); };\n    if (this.state.page !== 'home') this.goPage({ page: 'home' }, go); else go();\n  }\n  setDur(id, h) { this.setState(s => ({ durs: { ...s.durs, [id]: h }, sessionId: null })); }\n  openCourse(id, h, sid) { this.goPage(s => ({ page: 'course', courseId: id, durs: h ? { ...s.durs, [id]: h } : s.durs, sessionId: sid || null, signupDone: false })); }\n  seatsLabel(n) { return n <= 4 ? `Zostały ${n} miejsca` : `Wolne miejsca: ${n}`; }\n  row(x) {\n    const c = this.courses.find(k => k.id === x.c);\n    return { ...x, courseName: c.name, hours: x.h + ' h', seatsLabel: this.seatsLabel(x.seats), seatsShort: x.seats <= 4 ? `${x.seats} miejsca` : `${x.seats} wolnych`, seatsColor: x.seats <= 4 ? this.pal.low : this.pal.ok, pick: () => this.openCourse(x.c, x.h, x.id) };\n  }\n  renderVals() {\n    const P = this.pal, s = this.state, zl = n => n.toLocaleString('pl-PL') + ' zł';\n    const seg = on => ({ bg: on ? P.onBg : P.offBg, fg: on ? P.onFg : P.offFg });\n    const cards = this.courses.map(c => {\n      const d = s.durs[c.id], n = this.sess.find(x => x.c === c.id && x.h === d) || this.sess.find(x => x.c === c.id);\n      return { ...c, price: zl(c.price[d]), count: `${d === 4 ? 4 : 8} modułów · ${d} h`, is4: d === 4, is8: d === 8, bg4: seg(d === 4).bg, fg4: seg(d === 4).fg, bg8: seg(d === 8).bg, fg8: seg(d === 8).fg,\n        set4: () => this.setDur(c.id, 4), set8: () => this.setDur(c.id, 8), open: () => this.openCourse(c.id), nextDate: n ? `${n.day} ${n.mon} · ${n.fmt}` : 'wkrótce' };\n    });\n    const filters = [{ id: 'all', label: 'Wszystkie' }, ...this.courses.map(c => ({ id: c.id, label: c.name }))].map(f => ({ ...f, on: s.filter === f.id, bg: s.filter === f.id ? P.onBg : P.offBg, fg: s.filter === f.id ? P.onFg : P.offFg, pick: () => this.setState({ filter: f.id }, () => setTimeout(() => window.ScrollTrigger && window.ScrollTrigger.refresh(), 50)) }));\n    const rows = this.sess.filter(x => s.filter === 'all' || x.c === s.filter).map(x => this.row(x));\n    const cur = this.courses.find(c => c.id === s.courseId), d = s.durs[cur.id];\n    const cSessions = this.sess.filter(x => x.c === cur.id && x.h === d).map(x => {\n      const on = s.sessionId === x.id;\n      return { ...this.row(x), on, bg: on ? '#141210' : 'transparent', fg: on ? '#F4F1EC' : '#141210', bd: on ? '#141210' : '#D6CFC5', select: () => this.setState({ sessionId: x.id }) };\n    });\n    const selected = this.sess.find(x => x.id === s.sessionId);\n    return {\n      isHome: s.page === 'home', isCourse: s.page === 'course', showPrices: this.props.showPrices ?? true,\n      goHome: () => this.goPage({ page: 'home' }),\n      toCourses: () => this.scrollTo('kursy'), toTerms: () => this.scrollTo('terminy'), toB2b: () => this.scrollTo('firmy'), toTrainers: () => this.scrollTo('trenerzy'), toLead: () => this.scrollTo('lekcja'), toB2bForm: () => this.scrollTo('firmy'),\n      heroNext: this.row(this.sess[0]), logos: [1, 2, 3, 4, 5, 6, 1, 2, 3, 4, 5, 6],\n      cards, filters, rows, trainers: this.trainers, quotes: this.quotes,\n      faq: this.faqs.map((f, i) => ({ q: f[0], a: f[1], open: s.faq === i, sign: s.faq === i ? '−' : '+', toggle: () => this.setState({ faq: s.faq === i ? -1 : i }) })),\n      leadOpen: !s.leadDone, leadDone: s.leadDone, email: s.email,\n      onEmail: e => this.setState({ email: e.target.value }),\n      submitLead: () => { if (/\\S+@\\S+\\.\\S+/.test(s.email)) this.setState({ leadDone: true }); },\n      cur, isZero: cur.id === 'zero', isCode: cur.id === 'code', isCowork: cur.id === 'cowork',\n      cSet4: () => this.setDur(cur.id, 4), cSet8: () => this.setDur(cur.id, 8),\n      cBg4: seg(d === 4).bg, cFg4: seg(d === 4).fg, cBg8: seg(d === 8).bg, cFg8: seg(d === 8).fg,\n      cDurNote: d === 4 ? 'Pół dnia · 4 moduły podstaw' : 'Cały dzień · 8 modułów + warsztat',\n      cModCount: `${d} h`, cPrice: zl(cur.price[d]), cHours: d + ' godzin',\n      cModules: cur.m.slice(0, d === 4 ? 4 : 8).map((m, i) => ({ n: String(i + 1).padStart(2, '0'), t: m[0], d: m[1], extra: i >= 4 })),\n      cFor: cur.for, cOut: cur.out, cSessions, hasSessions: cSessions.length > 0, noSessions: cSessions.length === 0,\n      signupOpen: !s.signupDone, signupDone: s.signupDone, selectedLabel: selected ? `${selected.day} ${selected.mon}, ${selected.fmt}` : '',\n      canSubmit: !!selected, submitSignup: () => { if (selected) this.setState({ signupDone: true }); },\n      others: this.courses.filter(c => c.id !== cur.id).map(c => ({ ...c, open: () => this.openCourse(c.id) }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
